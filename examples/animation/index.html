<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animation — @dxyl/graphics</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1017;
        color: #e6edf3;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .stage {
        position: relative;
        width: min(880px, 92vw);
        height: min(560px, 70vh);
        border: 1px solid #26303d;
        border-radius: 10px;
        overflow: hidden;
        background: #11151d;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 6px 9px;
        border-radius: 7px;
        background: rgb(8 11 16 / 78%);
        border: 1px solid #2b3541;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      .bar {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        height: 3px;
        border-radius: 2px;
        background: rgb(255 255 255 / 10%);
        overflow: hidden;
        pointer-events: none;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: #3fbf8f;
      }
      .notice {
        margin: 0;
        max-width: 37em;
        padding: 14px 16px;
        border: 1px solid #7a4a12;
        border-radius: 9px;
        background: #2a1d0c;
        color: #ffd9a0;
      }
      .notice[hidden] {
        display: none;
      }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <h1>Animation</h1>
    <div class="stage">
      <canvas id="stage"></canvas>
      <div class="overlay" id="overlay">booting…</div>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <p class="notice" id="notice" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
